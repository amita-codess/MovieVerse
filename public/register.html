<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - MovieVerse</title>
  <meta name="description" content="Join MovieVerse to discover, bookmark, and curate your personal movie watchlists.">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            mv: {
              bg: '#050505',
              secondary: '#0f0f0f',
              card: '#171717',
              cardHover: '#212121',
              accent: '#e50914',
              accentHover: '#ff2633',
              textPrimary: '#ffffff',
              textSecondary: '#a3a3a3',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Poppins', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom MovieVerse CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#050505] text-white min-h-screen font-sans flex flex-col selection:bg-[#e50914] selection:text-white">

  <!-- Simple Navbar -->
  <header class="bg-[#050505]/90 backdrop-blur-md border-b border-white/10 py-4">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 text-xl font-bold font-display tracking-wider text-white">
        <div class="w-7 h-7 rounded-lg bg-[#e50914] flex items-center justify-center text-white text-sm">
          <i class="bi bi-film"></i>
        </div>
        <span><span class="text-[#e50914]">MOVIE</span><span class="text-white">VERSE</span></span>
      </a>
      <div class="flex items-center gap-2">
        <span class="text-xs text-white/50 hidden sm:inline">Already registered?</span>
        <a href="login.html" class="text-xs font-semibold px-3 py-1.5 rounded-lg border border-white/15 text-white/80 hover:text-white hover:bg-white/5 transition-colors">
          Sign In
        </a>
      </div>
    </div>
  </header>

  <!-- Register Card Section -->
  <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6">
    <div class="w-full max-w-md bg-[#171717]/95 border border-white/10 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl relative">
      
      <!-- Top Icon & Header -->
      <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-xl bg-[#e50914]/15 border border-[#e50914]/30 flex items-center justify-center mx-auto mb-3 text-[#e50914] text-xl shadow-lg">
          <i class="bi bi-person-plus-fill"></i>
        </div>
        <h1 class="text-2xl font-black font-display text-white">Create Account</h1>
        <p class="text-white/50 text-xs sm:text-sm mt-1">Join MovieVerse to save watchlists and explore movies</p>
      </div>

      <!-- Error Alert Box -->
      <div id="registerErrorAlert" class="hidden mb-4 p-3 rounded-xl bg-red-950/50 border border-[#e50914]/50 text-xs text-red-300 flex items-center gap-2">
        <i class="bi bi-exclamation-circle-fill text-base text-[#e50914]"></i>
        <span id="registerErrorMessage">Registration failed.</span>
      </div>

      <!-- Register Form -->
      <form id="registerForm" class="space-y-3.5">
        <div>
          <label for="regName" class="block text-xs font-semibold uppercase tracking-wider text-white/70 mb-1">
            Full Name
          </label>
          <div class="relative">
            <i class="bi bi-person absolute left-3.5 top-3 text-white/40 text-sm"></i>
            <input type="text" 
                   id="regName" 
                   class="w-full bg-[#0f0f0f] border border-white/15 text-white placeholder-white/30 text-sm rounded-xl pl-10 pr-4 py-2.5 focus:outline-none focus:border-[#e50914] focus:ring-1 focus:ring-[#e50914] transition-all" 
                   placeholder="e.g. John Doe" 
                   required>
          </div>
        </div>

        <div>
          <label for="regEmail" class="block text-xs font-semibold uppercase tracking-wider text-white/70 mb-1">
            Email Address
          </label>
          <div class="relative">
            <i class="bi bi-envelope absolute left-3.5 top-3 text-white/40 text-sm"></i>
            <input type="email" 
                   id="regEmail" 
                   class="w-full bg-[#0f0f0f] border border-white/15 text-white placeholder-white/30 text-sm rounded-xl pl-10 pr-4 py-2.5 focus:outline-none focus:border-[#e50914] focus:ring-1 focus:ring-[#e50914] transition-all" 
                   placeholder="e.g. john@example.com" 
                   required>
          </div>
        </div>

        <div>
          <label for="regPassword" class="block text-xs font-semibold uppercase tracking-wider text-white/70 mb-1">
            Password (min 6 characters)
          </label>
          <div class="relative">
            <i class="bi bi-lock absolute left-3.5 top-3 text-white/40 text-sm"></i>
            <input type="password" 
                   id="regPassword" 
                   class="w-full bg-[#0f0f0f] border border-white/15 text-white placeholder-white/30 text-sm rounded-xl pl-10 pr-4 py-2.5 focus:outline-none focus:border-[#e50914] focus:ring-1 focus:ring-[#e50914] transition-all" 
                   placeholder="Create password" 
                   required minlength="6">
          </div>
        </div>

        <div>
          <label for="regConfirmPassword" class="block text-xs font-semibold uppercase tracking-wider text-white/70 mb-1">
            Confirm Password
          </label>
          <div class="relative">
            <i class="bi bi-check2-circle absolute left-3.5 top-3 text-white/40 text-sm"></i>
            <input type="password" 
                   id="regConfirmPassword" 
                   class="w-full bg-[#0f0f0f] border border-white/15 text-white placeholder-white/30 text-sm rounded-xl pl-10 pr-4 py-2.5 focus:outline-none focus:border-[#e50914] focus:ring-1 focus:ring-[#e50914] transition-all" 
                   placeholder="Re-enter password" 
                   required>
          </div>
        </div>

        <button type="submit" 
                id="submitRegisterBtn"
                class="btn-mv-primary w-full py-3 rounded-xl text-sm font-bold flex items-center justify-center gap-2 shadow-lg shadow-[#e50914]/25 mt-2">
          <span id="regBtnText" class="flex items-center gap-2">
            <i class="bi bi-person-check-fill"></i> Complete Registration
          </span>
          <span id="regSpinner" class="hidden spinner-border spinner-border-sm" role="status"></span>
        </button>
      </form>

      <!-- Footer Link -->
      <div class="text-center mt-6 pt-4 border-t border-white/10 text-xs text-white/50">
        Already have an account? 
        <a href="login.html" class="text-[#e50914] font-bold hover:underline ml-1">Sign In</a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="py-4 text-center text-xs text-white/40 border-t border-white/10">
    © 2026 MovieVerse. Full-Stack Java Spring Boot & Tailwind CSS.
  </footer>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- MovieVerse App Engine JS -->
  <script src="js/app.js"></script>

  <!-- Page Specific Logic -->
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;

      const errorAlert = document.getElementById('registerErrorAlert');
      const errorMsg = document.getElementById('registerErrorMessage');
      const btnText = document.getElementById('regBtnText');
      const spinner = document.getElementById('regSpinner');
      const submitBtn = document.getElementById('submitRegisterBtn');

      errorAlert.classList.add('hidden');

      if (!name || !email || !password || !confirmPassword) {
        errorMsg.textContent = 'All fields are required.';
        errorAlert.classList.remove('hidden');
        return;
      }

      if (password.length < 6) {
        errorMsg.textContent = 'Password must be at least 6 characters long.';
        errorAlert.classList.remove('hidden');
        return;
      }

      if (password !== confirmPassword) {
        errorMsg.textContent = 'Passwords do not match.';
        errorAlert.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      btnText.classList.add('hidden');
      spinner.classList.remove('hidden');

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, confirmPassword })
        });

        const data = await response.json();

        if (response.ok) {
          Auth.setUser(data);
          Toast.show(`Account created! Welcome, ${data.name}!`, 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 800);
        } else {
          errorMsg.textContent = data.message || 'Registration failed.';
          errorAlert.classList.remove('hidden');
          submitBtn.disabled = false;
          btnText.classList.remove('hidden');
          spinner.classList.add('hidden');
        }
      } catch (err) {
        console.error(err);
        errorMsg.textContent = 'Failed to connect to backend server. Please try again.';
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        btnText.classList.remove('hidden');
        spinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
