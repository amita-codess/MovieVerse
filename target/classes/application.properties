# ===================================================================
# MovieVerse Spring Boot Application Configuration
# ===================================================================

# Server Port
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=MovieVerse

# MySQL Database Configuration (Secured via Environment Variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/movieverse_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:movieverse_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings (Safe production defaults: show-sql false to avoid logging sensitive query params)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Seed Data Initialization
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Static Resources Mapping
spring.web.resources.static-locations=classpath:/static/

# OMDb API Configuration (Never hardcoded; injected securely via environment variable)
omdb.api.key=${OMDB_API_KEY:}
omdb.api.url=https://www.omdbapi.com/

# JWT Secret & Expiration
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

